[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mantrap"
version = "1.5.0"
description = "OS-enforced sandbox CLI: run untrusted commands inside a deny-by-default bubblewrap sandbox"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
authors = [{ name = "mantrap contributors" }]
keywords = ["sandbox", "bubblewrap", "isolation", "security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
urls = { Homepage = "https://github.com/rayanalpha/mantrap" }

[project.scripts]
mantrap = "mantrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
